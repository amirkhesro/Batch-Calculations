[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batch-calculations"
version = "0.2.0"
description = "Stoichiometry and batch-weight calculations for solid-state ceramic synthesis."
readme = "README.md"
authors = [{ name = "Amir Khesro" }]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["stoichiometry", "ceramics", "solid-state synthesis", "batch calculation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "openpyxl",     # reads and writes the .xlsx log workbook
]

[project.scripts]
batchcalc = "batch_calculations.cli:main"

[project.urls]
Repository = "https://github.com/amirkhesro/batch-calculations"

# Tools used while developing, not needed to run the package.
# Installed by default with uv; skip them with:  uv sync --no-dev
[dependency-groups]
dev = [
    "pytest",
    "ipykernel",    # required for the "# %%" interactive cell workflow in VS Code
    "ruff!=0.16.1", # formatter and linter (0.16.1 shipped no Windows wheel)
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes errors, I = import sorting, UP = modern syntax.
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
